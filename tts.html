<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Siri TTS - Chuyển văn bản thành MP3</title>
  <!-- Lamejs để mã hóa WAV sang MP3 -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: #1c1c1e;
      border-radius: 36px;
      padding: 24px 20px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.15);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #8e8e93, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1 span {
      font-size: 32px;
      -webkit-text-fill-color: #fff;
    }
    .file-area {
      background: #2c2c2e;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px dashed #48484a;
      transition: border 0.2s;
    }
    .file-area.active {
      border-color: #0a84ff;
    }
    .file-label {
      font-size: 15px;
      color: #8e8e93;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type="file"] {
      display: none;
    }
    .file-btn {
      background: #3a3a3c;
      border: none;
      color: #fff;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .file-btn:active {
      background: #48484a;
    }
    textarea {
      width: 100%;
      height: 130px;
      background: #2c2c2e;
      border: 1px solid #48484a;
      border-radius: 18px;
      padding: 14px;
      color: #fff;
      font-size: 16px;
      resize: vertical;
      outline: none;
      transition: border 0.2s;
      line-height: 1.5;
    }
    textarea:focus {
      border-color: #0a84ff;
    }
    .speed-control {
      background: #2c2c2e;
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .speed-control label {
      font-weight: 500;
      font-size: 15px;
      color: #d1d1d6;
      white-space: nowrap;
    }
    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      background: #48484a;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: #0a84ff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(10,132,255,0.5);
      cursor: pointer;
    }
    #speedValue {
      font-weight: 600;
      font-size: 17px;
      color: #ffffff;
      min-width: 45px;
      text-align: right;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      flex: 1 1 auto;
      min-width: 80px;
      background: #3a3a3c;
      border: none;
      color: #fff;
      padding: 14px 12px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 590;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn:active {
      background: #48484a;
      transform: scale(0.97);
    }
    .btn.primary {
      background: #0a84ff;
      font-weight: 600;
    }
    .btn.primary:active {
      background: #0071e3;
    }
    .btn.record {
      background: #ff375f;
    }
    .btn.record:active {
      background: #d62b4b;
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .status {
      font-size: 14px;
      color: #8e8e93;
      text-align: center;
      min-height: 20px;
    }
    .voice-info {
      font-size: 13px;
      color: #8e8e93;
      background: #2c2c2e;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30d158;
      display: inline-block;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f2f2f7; }
      .container { background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
      textarea, .file-area, .speed-control, .voice-info { background: #f2f2f7; border-color: #e5e5ea; }
      .file-btn, .btn { background: #e5e5ea; color: #000; }
      .btn.primary { background: #007aff; color: #fff; }
      .btn.record { background: #ff3b30; color: #fff; }
      .voice-info, .status, .file-label { color: #3a3a3c; }
      h1 { -webkit-text-fill-color: #1c1c1e; background: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>🎙️</span> Siri TTS
    </h1>

    <div class="file-area" id="fileArea">
      <div class="file-label">
        <span>📄</span> Chọn file văn bản (.txt)
      </div>
      <input type="file" id="fileInput" accept=".txt, text/plain">
      <button class="file-btn" id="fileButton">
        <span>📂</span> Tải lên file TXT
      </button>
    </div>

    <textarea id="textInput" placeholder="Nhập hoặc dán văn bản vào đây..."></textarea>

    <div class="speed-control">
      <label>⚡ Tốc độ</label>
      <input type="range" id="speedRange" min="0.5" max="2.5" value="1.0" step="0.05">
      <span id="speedValue">1.0x</span>
    </div>

    <div class="btn-group">
      <button class="btn primary" id="playBtn">
        <span>▶️</span> Đọc
      </button>
      <button class="btn" id="pauseBtn" disabled>
        <span>⏸️</span> Tạm dừng
      </button>
      <button class="btn" id="stopBtn" disabled>
        <span>⏹️</span> Dừng
      </button>
    </div>

    <button class="btn record" id="recordBtn">
      <span>🔴</span> Ghi âm & Tải MP3
    </button>

    <div class="voice-info" id="voiceInfo">
      <span class="dot"></span> Giọng đọc: <span id="voiceName">Đang tải...</span>
    </div>
    <div class="status" id="statusMessage">Sẵn sàng</div>
  </div>

  <script>
    (function() {
      // ---------- DOM elements ----------
      const fileInput = document.getElementById('fileInput');
      const fileButton = document.getElementById('fileButton');
      const fileArea = document.getElementById('fileArea');
      const textInput = document.getElementById('textInput');
      const speedRange = document.getElementById('speedRange');
      const speedValue = document.getElementById('speedValue');
      const playBtn = document.getElementById('playBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const stopBtn = document.getElementById('stopBtn');
      const recordBtn = document.getElementById('recordBtn');
      const voiceNameSpan = document.getElementById('voiceName');
      const statusDiv = document.getElementById('statusMessage');

      // ---------- State ----------
      let selectedVoice = null;
      let utterance = null;
      let isPaused = false;
      let currentText = '';
      let mediaRecorder = null;
      let audioChunks = [];
      let recordingStream = null;
      let isRecording = false;
      let recordStartTime = 0;

      // ---------- Helper: set status ----------
      function setStatus(msg, isGood = true) {
        statusDiv.textContent = msg;
        statusDiv.style.color = isGood ? '#8e8e93' : '#ff375f';
      }

      // ---------- Load voices & find Siri ----------
      function loadVoices() {
        const voices = speechSynthesis.getVoices();
        if (!voices || voices.length === 0) {
          voiceNameSpan.textContent = 'Không có giọng';
          return;
        }
        // Tìm giọng Siri (ưu tiên tiếng Việt, sau đó tiếng Anh, rồi bất kỳ Siri)
        const siriVi = voices.find(v => v.name.toLowerCase().includes('siri') && v.lang.startsWith('vi'));
        const siriEn = voices.find(v => v.name.toLowerCase().includes('siri') && v.lang.startsWith('en'));
        const siriAny = voices.find(v => v.name.toLowerCase().includes('siri'));
        if (siriVi) {
          selectedVoice = siriVi;
        } else if (siriEn) {
          selectedVoice = siriEn;
        } else if (siriAny) {
          selectedVoice = siriAny;
        } else {
          // Fallback to default voice (usually first)
          selectedVoice = voices[0];
        }
        voiceNameSpan.textContent = selectedVoice ? `${selectedVoice.name} (${selectedVoice.lang})` : 'Mặc định';
        if (!selectedVoice) selectedVoice = voices[0];
      }

      // Safari sometimes loads voices asynchronously
      speechSynthesis.onvoiceschanged = () => {
        loadVoices();
      };
      loadVoices();

      // ---------- Update speed display ----------
      speedRange.addEventListener('input', () => {
        const val = parseFloat(speedRange.value).toFixed(2);
        speedValue.textContent = val + 'x';
      });

      // ---------- File handling ----------
      fileButton.addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.type !== 'text/plain' && !file.name.endsWith('.txt')) {
          setStatus('Vui lòng chọn file .txt', false);
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          textInput.value = ev.target.result;
          setStatus('Đã tải file: ' + file.name);
          fileArea.classList.add('active');
          setTimeout(() => fileArea.classList.remove('active'), 1000);
        };
        reader.onerror = () => setStatus('Lỗi đọc file', false);
        reader.readAsText(file, 'UTF-8');
      });

      // ---------- Text to speech core ----------
      function stopSpeaking() {
        speechSynthesis.cancel();
        utterance = null;
        isPaused = false;
        updateButtons(false, false);
      }

      function updateButtons(playing, paused) {
        playBtn.disabled = playing && !paused;
        pauseBtn.disabled = !playing || paused;
        stopBtn.disabled = !playing;
      }

      function createUtterance(text) {
        const utt = new SpeechSynthesisUtterance(text);
        if (selectedVoice) utt.voice = selectedVoice;
        utt.rate = parseFloat(speedRange.value);
        utt.lang = selectedVoice ? selectedVoice.lang : 'vi-VN';
        return utt;
      }

      function startSpeaking() {
        const text = textInput.value.trim();
        if (!text) {
          setStatus('Vui lòng nhập văn bản', false);
          return;
        }
        stopSpeaking(); // cancel any previous
        currentText = text;
        utterance = createUtterance(text);
        
        utterance.onstart = () => {
          updateButtons(true, false);
          setStatus('Đang đọc...');
        };
        utterance.onend = () => {
          // If recording, stop recording after speech ends
          if (isRecording) {
            stopRecordingAndDownload();
          }
          updateButtons(false, false);
          setStatus('Đã đọc xong');
          utterance = null;
        };
        utterance.onerror = (e) => {
          if (e.error !== 'canceled' && e.error !== 'interrupted') {
            setStatus('Lỗi phát: ' + e.error, false);
          }
          if (isRecording) {
            stopRecordingAndDownload();
          }
          updateButtons(false, false);
          utterance = null;
        };
        utterance.onpause = () => {
          updateButtons(true, true);
          setStatus('Đã tạm dừng');
        };
        utterance.onresume = () => {
          updateButtons(true, false);
          setStatus('Đang đọc...');
        };

        speechSynthesis.speak(utterance);
      }

      function pauseSpeaking() {
        if (speechSynthesis.speaking && !speechSynthesis.paused) {
          speechSynthesis.pause();
          isPaused = true;
          updateButtons(true, true);
          setStatus('Đã tạm dừng');
        }
      }

      function resumeSpeaking() {
        if (speechSynthesis.paused) {
          speechSynthesis.resume();
          isPaused = false;
          updateButtons(true, false);
          setStatus('Đang đọc...');
        }
      }

      // Play button: start or resume
      playBtn.addEventListener('click', () => {
        if (speechSynthesis.paused) {
          resumeSpeaking();
        } else if (!speechSynthesis.speaking) {
          startSpeaking();
        }
      });

      pauseBtn.addEventListener('click', () => {
        if (speechSynthesis.speaking && !speechSynthesis.paused) {
          pauseSpeaking();
        } else if (speechSynthesis.paused) {
          resumeSpeaking();
        }
      });

      stopBtn.addEventListener('click', () => {
        stopSpeaking();
        setStatus('Đã dừng');
      });

      // ---------- Recording logic (microphone capture) ----------
      async function startRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false 
            } 
          });
          recordingStream = stream;
          audioChunks = [];
          
          // Check supported MIME types on Safari
          let mimeType = 'audio/webm';
          if (MediaRecorder.isTypeSupported('audio/mp4')) {
            mimeType = 'audio/mp4';
          } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            mimeType = 'audio/webm;codecs=opus';
          } else if (MediaRecorder.isTypeSupported('audio/webm')) {
            mimeType = 'audio/webm';
          }
          
          mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
          
          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };
          
          mediaRecorder.onstop = () => {
            // Process audio chunks into MP3
            processRecording();
          };
          
          mediaRecorder.start();
          isRecording = true;
          recordStartTime = Date.now();
          recordBtn.textContent = '🔴 Đang ghi... (bấm để dừng)';
          recordBtn.style.background = '#ff375f';
          setStatus('🔴 Đang ghi âm - hãy bật loa ngoài và âm lượng lớn');
        } catch (err) {
          setStatus('Không thể truy cập microphone: ' + err.message, false);
          console.error(err);
        }
      }

      function stopRecordingAndDownload() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          // Stop all tracks
          if (recordingStream) {
            recordingStream.getTracks().forEach(track => track.stop());
            recordingStream = null;
          }
          isRecording = false;
          recordBtn.textContent = '🔴 Ghi âm & Tải MP3';
          recordBtn.style.background = '#ff375f';
        }
      }

      async function processRecording() {
        if (audioChunks.length === 0) {
          setStatus('Không có dữ liệu ghi âm', false);
          return;
        }
        
        setStatus('Đang xử lý audio...');
        const mimeType = mediaRecorder.mimeType;
        const blob = new Blob(audioChunks, { type: mimeType });
        
        try {
          // Convert blob to AudioBuffer
          const arrayBuffer = await blob.arrayBuffer();
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          let audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
          
          // If recording duration is very short, trim silence
          const duration = audioBuffer.duration;
          if (duration < 0.5) {
            setStatus('Bản ghi quá ngắn, hãy thử lại', false);
            return;
          }
          
          // Convert AudioBuffer to WAV
          const wavBuffer = audioBufferToWav(audioBuffer);
          
          // Encode WAV to MP3 using lamejs
          const mp3Blob = encodeWavToMp3(wavBuffer, audioBuffer.sampleRate);
          
          // Trigger download
          const url = URL.createObjectURL(mp3Blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `siri_tts_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.mp3`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          
          setStatus('✅ Đã tải file MP3 thành công!');
        } catch (err) {
          console.error(err);
          setStatus('Lỗi xử lý âm thanh: ' + err.message, false);
        }
      }

      // Convert AudioBuffer to WAV (PCM 16-bit)
      function audioBufferToWav(audioBuffer) {
        const numChannels = audioBuffer.numberOfChannels;
        const sampleRate = audioBuffer.sampleRate;
        const format = 1; // PCM
        const bitsPerSample = 16;
        const samples = audioBuffer.getChannelData(0); // mono or first channel
        const length = samples.length;
        
        const buffer = new ArrayBuffer(44 + length * 2);
        const view = new DataView(buffer);
        
        function writeString(offset, string) {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        }
        
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + length * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, format, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numChannels * bitsPerSample / 8, true);
        view.setUint16(32, numChannels * bitsPerSample / 8, true);
        view.setUint16(34, bitsPerSample, true);
        writeString(36, 'data');
        view.setUint32(40, length * 2, true);
        
        let offset = 44;
        for (let i = 0; i < length; i++) {
          let s = Math.max(-1, Math.min(1, samples[i]));
          s = s < 0 ? s * 0x8000 : s * 0x7FFF;
          view.setInt16(offset, s, true);
          offset += 2;
        }
        
        return new Uint8Array(buffer);
      }

      // Encode WAV PCM to MP3 using lamejs
      function encodeWavToMp3(wavBytes, sampleRate) {
        if (typeof lamejs === 'undefined') {
          throw new Error('Thư viện lamejs chưa được tải');
        }
        const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128); // mono, 128kbps
        const samples = new Int16Array(wavBytes.buffer, 44, (wavBytes.length - 44) / 2);
        const mp3Data = [];
        
        const blockSize = 1152;
        for (let i = 0; i < samples.length; i += blockSize) {
          const chunk = samples.subarray(i, i + blockSize);
          const mp3buf = mp3encoder.encodeBuffer(chunk);
          if (mp3buf.length > 0) {
            mp3Data.push(new Int8Array(mp3buf));
          }
        }
        const endBuf = mp3encoder.flush();
        if (endBuf.length > 0) {
          mp3Data.push(new Int8Array(endBuf));
        }
        
        const blob = new Blob(mp3Data, { type: 'audio/mp3' });
        return blob;
      }

      // Record button click handler
      recordBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
          setStatus('Vui lòng nhập văn bản trước khi ghi âm', false);
          return;
        }
        
        // If already recording, stop manually
        if (isRecording) {
          stopSpeaking(); // stop speech and recording
          return;
        }
        
        // Request microphone and start recording
        await startRecording();
        
        // Start speaking (will auto-stop recording when speech ends)
        if (isRecording) {
          // Small delay to ensure recording is ready
          setTimeout(() => {
            startSpeaking();
          }, 200);
        }
      });

      // Cleanup on page unload
      window.addEventListener('beforeunload', () => {
        stopSpeaking();
        if (recordingStream) {
          recordingStream.getTracks().forEach(t => t.stop());
        }
      });

      // Initialize button states
      updateButtons(false, false);
      setStatus('Sẵn sàng');
    })();
  </script>
</body>
</html>
